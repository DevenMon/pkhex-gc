name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          DEVKITPPC: /opt/devkitpro/devkitPPC
        run: ./build.sh --native

      - name: Verify
        run: test -s pkhex-gc.dol

      - uses: actions/upload-artifact@v4
        with:
          name: pkhex-gc-dol
          path: |
            pkhex-gc.dol
            pkhex-gc.elf
          if-no-files-found: error
