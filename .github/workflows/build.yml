name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          DEVKITPPC: /opt/devkitpro/devkitPPC
        run: ./build.sh --native

      - name: Verify
        run: test -s pkhex-gc.dol

      - uses: actions/upload-artifact@v4
        with:
          name: pkhex-gc-dol
          path: |
            pkhex-gc.dol
            pkhex-gc.elf
          if-no-files-found: error

  # A GitHub Release gets the DOL attached to it, so people do not have to dig
  # a build artifact out of a workflow run. This covers both ways of making
  # one: pushing a v* tag from a clone, and publishing a release from the web
  # UI (which creates the tag itself).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pkhex-gc-dol

      # Create the release if the tag arrived on its own, or attach the build
      # to the release that already exists if the web UI made it first.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test -s pkhex-gc.dol
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" pkhex-gc.dol pkhex-gc.elf --clobber
          else
            gh release create "$TAG" \
              --title "PKHeX-GC ${TAG#v}" \
              --notes-file RELEASE-NOTES.md \
              pkhex-gc.dol pkhex-gc.elf
          fi
