name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach this build to an existing release, e.g. v1.0. Leave blank to only build.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          DEVKITPPC: /opt/devkitpro/devkitPPC
        run: ./build.sh --native

      - name: Verify
        run: test -s pkhex-gc.dol

      - uses: actions/upload-artifact@v4
        with:
          name: pkhex-gc-dol
          path: |
            pkhex-gc.dol
            pkhex-gc.elf
          if-no-files-found: error

  # A GitHub Release gets the DOL attached to it, so people do not have to dig
  # a build artifact out of a workflow run. Three ways in: a pushed v* tag,
  # publishing a release from the web UI, and running this workflow by hand
  # with release_tag set, which is the way to fix up a release whose own run
  # failed or predates this job.
  release:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'release'
      || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pkhex-gc-dol

      # Create the release if the tag arrived on its own, or attach the build
      # to the release that already exists if the web UI made it first.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          test -s pkhex-gc.dol
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" pkhex-gc.dol pkhex-gc.elf --clobber
          else
            gh release create "$TAG" \
              --title "PKHeX-GC ${TAG#v}" \
              --notes-file RELEASE-NOTES.md \
              pkhex-gc.dol pkhex-gc.elf
          fi
